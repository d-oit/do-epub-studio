name = "do-epub-studio"
pages_build_output_dir = "apps/web/dist"
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat"]

# Pages Functions bindings (GOAP-252 / issue #1014). Declared here so the
# Cloudflare Pages Git-integrated build attaches them to the `/api/*` function
# (dashboard/API deployment_configs bindings were not being applied to builds).
# Secrets (SESSION_SIGNING_SECRET, INVITE_TOKEN_SECRET) stay in the dashboard.

[[d1_databases]]
binding = "DB"
database_name = "do-epub-studio"
database_id = "dd47f3de-9ea0-4a00-898d-c49cc0dd271f"
migrations_dir = "packages/schema/migrations"

[[r2_buckets]]
binding = "BOOKS_BUCKET"
bucket_name = "do-epub-studio-books"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "5328daf8b5de4c0da83ac97ee4cc9ea4"

[vars]
APP_BASE_URL = "https://do-epub-studio.pages.dev"
ENVIRONMENT = "production"
WEBAUTHN_RP_ID = "do-epub-studio.pages.dev"
WEBAUTHN_RP_NAME = "d.o.EPUB Studio"
WEBAUTHN_ORIGIN = "https://do-epub-studio.pages.dev"

# Preview binds its own D1 (plan 1009 P-02). Preview is the only environment that
# enables the demo gates, so the ADR-233 demo seed writes its demo accounts,
# book and grant here. Sharing production's database made those rows reachable
# through the production credential path (/api/access/request), which the demo
# flags do not gate.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "do-epub-studio-preview"
database_id = "0211de6a-1eb5-422c-9fb0-27360a25bb6a"
migrations_dir = "packages/schema/migrations"

# Demo assets must never share production's object namespace. Provision this
# bucket explicitly before running scripts/seed-demo-preview.mjs.
[[env.preview.r2_buckets]]
binding = "BOOKS_BUCKET"
bucket_name = "do-epub-studio-books-preview"

[[env.preview.kv_namespaces]]
binding = "CACHE_KV"
id = "5328daf8b5de4c0da83ac97ee4cc9ea4"

[env.preview.vars]
APP_BASE_URL = "https://do-epub-studio.pages.dev"
ENVIRONMENT = "preview"
DEMO_LOGIN_ENABLED = "1"
DEMO_ACCOUNTS_PROD_ALLOWLIST = "demo-preview"
WEBAUTHN_RP_ID = "do-epub-studio.pages.dev"
WEBAUTHN_RP_NAME = "d.o.EPUB Studio"
WEBAUTHN_ORIGIN = "https://do-epub-studio.pages.dev"
