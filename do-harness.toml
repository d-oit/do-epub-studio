# do-harness.toml — sensor pack for this workspace.
#
# Policy (ADR-246 / GOAP-269): sensors wrap the SAME pnpm scripts that
# `scripts/quality_gate.sh` and CI run, so local evidence and CI cannot
# drift. do-harness owns the agent loop + evidence freshness; the CI Full
# Quality Gate remains the merge-blocking source of truth. Git hooks are
# intentionally NOT managed here (repo hooks live in `scripts/hooks/`).
language = "generic"

[hooks]
pre-commit = []
pre-push = []

[signal-sets]
feedback = ["verify-fast"]
verification = ["typecheck", "lint", "test-unit", "skills", "loc", "web-ui-tests"]
release = [
  "typecheck",
  "lint",
  "test-unit",
  "skills",
  "loc",
  "web-ui-tests",
  "agent-sync",
  "workflows",
  "bundle",
  "app-identity",
  "adr-index",
  "plan-references",
  "overlap",
  "release-notes",
  "untrusted-ingest",
  "gate-parity",
  "coverage-parity",
  "llms-drift",
  "compliance-drift",
]

# GOAP-269 Phase 4: the upstream `web-ui` pack (d-o-hub/do-harness#75,
# shipped in v0.1.1). Added ADDITIVELY rather than via `init --language web`,
# which rewrites `do-harness.toml`, `AGENTS.md` and `plans/invariants.json` and
# would discard the six generic sensors above — including `loc`, whose baseline
# encodes ADR-278.
#
# These runners are the same code the web pack ships, so local evidence and CI
# run identical logic (ADR-246 §Decision 1). They print "SKIP:" and exit 0 when
# Playwright is absent or `WEB_AUDIT_ROUTES` is unset — verify reports WARN,
# and `--strict` promotes it — so a developer without a browser is never
# blocked. Findings exceed the cap and exit 1 with the JSON report on stderr.
#
# Not wired into the `verification` signal set: the viewport/a11y sensors need a
# running dev server (`WEB_AUDIT_BASE_URL`), which a push hook cannot assume.
# They are opt-in via `WEB_AUDIT_ROUTES`, so registering them here advertises
# the capability without making the default set unrunnable.
web-ui = ["viewport-ux", "a11y", "console", "perf", "visual", "i18n"]

[[sensors]]
name = "verify-fast"
argv = ["pnpm", "verify:fast"]
when-changed = [
  "**/*.ts",
  "**/*.tsx",
  "**/package.json",
  "pnpm-lock.yaml",
]

[[sensors]]
name = "typecheck"
argv = ["pnpm", "typecheck"]
when-changed = [
  "**/*.ts",
  "**/*.tsx",
  "**/tsconfig.json",
  "**/package.json",
  "pnpm-lock.yaml",
]

[[sensors]]
name = "lint"
argv = ["pnpm", "lint"]
when-changed = [
  "**/*.ts",
  "**/*.tsx",
  "eslint.config.js",
  "packages/*/eslint.config.mjs",
  ".github/workflows/**",
  "scripts/**",
]

[[sensors]]
name = "test-unit"
argv = ["pnpm", "test:unit"]
when-changed = [
  "**/*.ts",
  "**/*.tsx",
  "**/package.json",
  "pnpm-lock.yaml",
  "packages/*/vitest.config.*",
  "apps/*/vitest.config.*",
]

# Encodes the GOAP-256 lesson locally: new .agents/skills/<name> entries
# require the .claude/skills/<name> mirror symlink, which only the CI Full
# Quality Gate validated before this sensor existed.
[[sensors]]
name = "skills"
argv = ["bash", "scripts/validate-skills.sh"]
when-changed = [
  ".agents/skills/**",
  ".claude/skills/**",
  "scripts/validate-skills.sh",
]

# GOAP-276 P0 #4: 500-line source cap with a shrink-only ratchet baseline
# (ADR-278). Same command as the quality-gate phase — ADR-246 parity.
[[sensors]]
name = "loc"
argv = ["node", "scripts/check-loc.mjs"]
when-changed = [
  "**/*.ts",
  "**/*.tsx",
  "**/*.js",
  "**/*.jsx",
  "**/*.mjs",
  "**/*.cjs",
  "**/*.py",
  "**/*.sh",
  "scripts/loc-baseline.json",
  "scripts/check-loc.mjs",
]

# --- GOAP-269 Phase 4: web-ui sensors (upstream d-o-hub/do-harness#75) -----
#
# `when-changed` mirrors what each runner can actually observe. The viewport and
# a11y sensors read rendered text and geometry, so they are scoped to UI sources;
# the console/perf sensors read runtime signals from the same routes. i18n needs
# WEB_AUDIT_LOCALES as well, and blesses no baselines.
#
# None of these are in the default `verification` set — see the note on the
# `web-ui` signal set above.

[[sensors]]
name = "viewport-ux"
argv = ["node", "scripts/viewport-audit.mjs"]
when-changed = [
  "apps/web/src/**/*.tsx",
  "packages/ui/src/**/*.tsx",
  "apps/web/src/**/*.css",
]

[[sensors]]
name = "a11y"
argv = ["node", "scripts/a11y-audit.mjs"]
when-changed = [
  "apps/web/src/**/*.tsx",
  "packages/ui/src/**/*.tsx",
  "apps/web/src/**/*.css",
]

[[sensors]]
name = "console"
argv = ["node", "scripts/console-audit.mjs"]
when-changed = [
  "apps/web/src/**/*.ts",
  "apps/web/src/**/*.tsx",
  "packages/ui/src/**/*.ts",
  "packages/ui/src/**/*.tsx",
]

[[sensors]]
name = "perf"
argv = ["node", "scripts/perf-audit.mjs"]
when-changed = [
  "apps/web/src/**/*.ts",
  "apps/web/src/**/*.tsx",
  "apps/web/vite.config.*",
  "apps/web/package.json",
]

[[sensors]]
name = "visual"
argv = ["node", "scripts/visual-audit.mjs"]
when-changed = [
  "apps/web/src/**/*.tsx",
  "packages/ui/src/**/*.tsx",
  "apps/web/src/**/*.css",
  "packages/ui/tailwind.config.*",
]

[[sensors]]
name = "i18n"
argv = ["node", "scripts/i18n-audit.mjs"]
when-changed = [
  "apps/web/src/i18n/**",
  "apps/web/src/**/*.tsx",
]

# The audit library's own suite. Browser-independent (the `.browser` variant is
# included by this path and self-skips without Playwright), so unlike the six
# sensors above it runs anywhere — which makes it the one piece of the web pack
# that belongs in the default `verification` set.
[[sensors]]
name = "web-ui-tests"
argv = ["node", "--test", "scripts/web-ui/audit.test.mjs", "scripts/web-ui/audit.browser.test.mjs"]
when-changed = [
  "scripts/web-ui/**",
  "scripts/*-audit.mjs",
]

# --- GOAP-276 Phase 1: Gate-only shell and script validator sensors ---

[[sensors]]
name = "agent-sync"
argv = ["node", "scripts/check-agent-sync.mjs"]
when-changed = [
  "scripts/check-agent-sync.mjs",
  "AGENTS.md",
  ".agents/AGENTS.md",
  ".claude/CLAUDE.md",
  ".cursorrules",
  ".windsurfrules",
  "CLAUDE.md",
]

[[sensors]]
name = "workflows"
argv = ["bash", "scripts/validate-workflows.sh"]
when-changed = [
  ".github/workflows/**",
  "scripts/validate-workflows.sh",
]

[[sensors]]
name = "bundle"
argv = ["node", "scripts/check-bundle-budget.mjs"]
when-changed = [
  "scripts/check-bundle-budget.mjs",
  "scripts/bundle-baseline.json",
  "apps/web/src/**",
  "apps/web/vite.config.*",
]

[[sensors]]
name = "app-identity"
argv = ["node", "scripts/check-app-identity.mjs"]
when-changed = [
  "scripts/check-app-identity.mjs",
  "VERSION",
  "package.json",
  "apps/*/package.json",
  "packages/*/package.json",
]

[[sensors]]
name = "adr-index"
argv = ["node", "scripts/check-adr-index.mjs"]
when-changed = [
  "plans/*.md",
  "plans/archive/*.md",
  "scripts/check-adr-index.mjs",
]

[[sensors]]
name = "release-notes"
argv = ["bash", "scripts/release/check-release-notes.sh"]
when-changed = [
  "CHANGELOG.md",
  "VERSION",
  "scripts/release/check-release-notes.sh",
]

[[sensors]]
name = "untrusted-ingest"
argv = ["node", "scripts/check-untrusted-ingest-sinks.mjs"]
when-changed = [
  ".agents/skills/pr-review-fix/**",
  ".agents/skills/pr-roast-batch-close/**",
  ".agents/skills/github-pr-autopilot/**",
  "scripts/smart-update-pr.sh",
  ".github/workflows/bot-repush-guard.yml",
  "scripts/check-untrusted-ingest-sinks.mjs",
]

[[sensors]]
name = "plan-references"
argv = ["node", "scripts/check-plan-references.mjs"]
when-changed = [
  "plans/*.md",
  "plans/archive/*.md",
  "scripts/check-plan-references.mjs",
]

[[sensors]]
name = "gate-parity"
argv = ["bash", "scripts/validate-gate-parity.sh"]
when-changed = [
  "scripts/gate-manifest.json",
  "scripts/validate-gate-parity.sh",
  "scripts/quality_gate.sh",
  "scripts/lib/quality_gate_*.sh",
  ".github/workflows/**",
]

[[sensors]]
name = "overlap"
argv = ["do-harness", "overlap"]
when-changed = [
  ".agents/skills/**",
  "agents-docs/AVAILABLE_SKILLS.md",
  "do-harness.toml",
]

[[sensors]]
name = "coverage-parity"
argv = ["bash", "scripts/validate-coverage-parity.sh"]
when-changed = [
  "coverage-thresholds.json",
  "scripts/validate-coverage-parity.sh",
  "codecov.yml",
  "**/vitest.config.*",
]

# GOAP-276 Phase 2: report-only DORA trend. The script always exits 0 — a
# deployment-metrics breach is a signal to look at, not a merge condition, so
# this is deliberately outside the `release` set's hard-gate semantics.
[[sensors]]
name = "dora"
argv = ["bash", "scripts/report-dora.sh"]
when-changed = [
  "plans/dora.json",
  "scripts/report-dora.sh",
]

# GOAP-276 Phase 2: the LLM context files hand every agent a list of paths and
# commands. A stale entry turns that list into a set of lies, so the check
# fails when a referenced path or command no longer exists.
[[sensors]]
name = "llms-drift"
argv = ["bash", "scripts/check-llms-drift.sh"]
when-changed = [
  "llms.txt",
  "llms-full.txt",
  "scripts/check-llms-drift.sh",
]

# GOAP-276 Phase 2: the committed compliance mapping must match what the
# harness currently reports.
[[sensors]]
name = "compliance-drift"
argv = ["bash", "scripts/generate-compliance-doc.sh", "--check"]
when-changed = [
  "docs/compliance-mapping.md",
  "scripts/generate-compliance-doc.sh",
]
