name: Visual Regression
run-name: Visual Regression - ${{ github.event.pull_request.title || github.event_name }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'apps/web/src/**/*.css'
      - 'apps/web/tailwind.config.*'
      - 'apps/web/src/index.css'
  # Chromatic compares against the most recent build on the baseline branch.
  # Without a `main` build there is no baseline, so every PR reported "all
  # stories are new" and the PR status could never resolve to a pass. Publishing
  # on `main` is what makes the PR comparison meaningful. `onlyChanged: true`
  # keeps this to stories touched by the merge, not all 70.
  push:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'apps/web/src/**/*.css'
      - 'apps/web/tailwind.config.*'
      - 'apps/web/src/index.css'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Chromatic visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build Storybook
        working-directory: ./packages/ui
        run: pnpm build:storybook --stats-json --output-dir storybook-static

      - name: Publish to Chromatic
        uses: chromaui/action@6ac4c49524e1b1358b8c593c5eea877604228268 # v18.14.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          workingDir: packages/ui
          onlyChanged: true
          exitOnceUploaded: true
          exitZeroOnChanges: true
