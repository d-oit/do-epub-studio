name: Visual Regression
run-name: Visual Regression - ${{ github.event.pull_request.title || github.event_name }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/ui/**'
      - 'apps/web/src/**/*.css'
      - 'apps/web/tailwind.config.*'
      - 'apps/web/src/index.css'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Chromatic visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Build Storybook
        working-directory: ./packages/ui
        run: pnpm build:storybook --stats-json --output-dir storybook-static

      - name: Publish to Chromatic
        uses: chromaui/action@a18e9f57b71eb05f941848c0b927aab2ee644e3e # v18.10.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          workingDir: packages/ui
          onlyChanged: true
          exitOnceUploaded: true
          exitZeroOnChanges: true
