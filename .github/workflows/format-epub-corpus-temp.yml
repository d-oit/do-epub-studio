name: Temporary EPUB corpus formatter

on:
  push:
    branches:
      - feat/issue-1483-epub-corpus
    paths:
      - .github/workflows/format-epub-corpus-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup project dependencies
        uses: ./.github/actions/setup-pnpm

      - name: Apply repository Prettier
        run: pnpm exec prettier --write packages/reader-core/src/__tests__/epub-corpus.test.ts

      - name: Commit formatted file
        shell: bash
        run: |
          if git diff --quiet -- packages/reader-core/src/__tests__/epub-corpus.test.ts; then
            echo "The corpus test already matches Prettier."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/reader-core/src/__tests__/epub-corpus.test.ts
          git commit \
            -m "style(test): apply repository Prettier formatting" \
            -m "Format the EPUB corpus regression test with the exact pinned repository Prettier version."
          git push origin "HEAD:${GITHUB_REF_NAME}"
