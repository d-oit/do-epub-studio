name: Dependabot Auto-merge
run-name: Auto-merge ${{ github.event.pull_request.title }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Auto-merge minor/patch updates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Checkout base context (trusted script source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ADR-247 / GOAP-270: verify every SHA a Dependabot bump re-pins against
      # the action's own upstream tag, then commit the allowlist entry onto the
      # PR branch so CI goes green without manual edits. Fail closed: an
      # unverifiable SHA fails the step and leaves the allowlist untouched.
      # Runs from the BASE checkout so the verification logic cannot be altered
      # by the PR under test, and never merges — GOAP-224 no-automerge stands.
      - name: Verify and allowlist bumped action SHAs
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" > /tmp/pr.diff
          git fetch origin "$HEAD_REF"
          git worktree add --detach /tmp/pr-branch FETCH_HEAD
          scripts/allowlist-dependabot-shas.sh \
            --diff /tmp/pr.diff \
            --allowlist /tmp/pr-branch/scripts/validate-shas.sh
          if git -C /tmp/pr-branch diff --quiet -- scripts/validate-shas.sh; then
            echo "No new SHAs to allowlist."
            exit 0
          fi
          git -C /tmp/pr-branch config user.name "github-actions[bot]"
          git -C /tmp/pr-branch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/pr-branch add scripts/validate-shas.sh
          git -C /tmp/pr-branch commit -m "ci: allowlist verified SHAs from this dependabot bump"
          gh auth setup-git
          git -C /tmp/pr-branch push origin "HEAD:refs/heads/$HEAD_REF"

      - name: Fetch Dependabot PR metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          skip-commit-verification: true

      # GOAP-224 Step 9: the repo enforces an explicit no-automerge rule
      # (AGENTS.md Tier 1, commit bddcfc5). `gh pr merge --auto` violated it.
      # Approve + label `merge-ready` instead: a human explicitly merges, so a
      # Dependabot update can never land without a human ack.
      - name: Approve safe updates but require explicit merge (no-automerge rule)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          # GOAP-228 process fix: never re-bless a PR the owner blocked or whose
          # required checks are red. Only approve+label when it is actually
          # mergeable; otherwise strip `merge-ready` so the bot cannot mask a
          # blocked PR (e.g. #960 bundle-budget failure).
          STATE="$(gh pr view "$PR_URL" --json mergeStateStatus,statusCheckRollup -q '
            if (.mergeStateStatus == "BLOCKED") then "blocked"
            elif ([.statusCheckRollup[]? | select(
              .conclusion == "FAILURE" or .conclusion == "TIMED_OUT"
              or .conclusion == "ACTION_REQUIRED" or .conclusion == "CANCELLED"
            )] | length) > 0 then "failing"
            else "mergeable"
            end')"
          echo "dependabot mergeability state: $STATE"
          if [ "$STATE" = "mergeable" ]; then
            gh pr review --approve "$PR_URL"
            gh pr edit "$PR_URL" --add-label "merge-ready"
          else
            gh pr edit "$PR_URL" --remove-label "merge-ready" 2>/dev/null || true
            echo "Not approving $PR_URL — state=$STATE (owner block or failing checks)."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
