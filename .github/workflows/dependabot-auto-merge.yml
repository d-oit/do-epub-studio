name: Dependabot Auto-merge
run-name: Auto-merge ${{ github.event.pull_request.title }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Auto-merge minor/patch updates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot PR metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          skip-commit-verification: true

      # GOAP-224 Step 9: the repo enforces an explicit no-automerge rule
      # (AGENTS.md Tier 1, commit bddcfc5). `gh pr merge --auto` violated it.
      # Approve + label `merge-ready` instead: a human explicitly merges, so a
      # Dependabot update can never land without a human ack.
      - name: Approve safe updates but require explicit merge (no-automerge rule)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          # GOAP-228 process fix: never re-bless a PR the owner blocked or whose
          # required checks are red. Only approve+label when it is actually
          # mergeable; otherwise strip `merge-ready` so the bot cannot mask a
          # blocked PR (e.g. #960 bundle-budget failure).
          STATE="$(gh pr view "$PR_URL" --json mergeStateStatus,statusCheckRollup -q '
            if (.mergeStateStatus == "BLOCKED") then "blocked"
            elif ([.statusCheckRollup[]? | select(.conclusion == "FAILURE" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED" or .conclusion == "CANCELLED")] | length) > 0 then "failing"
            else "mergeable"
            end')"
          echo "dependabot mergeability state: $STATE"
          if [ "$STATE" = "mergeable" ]; then
            gh pr review --approve "$PR_URL"
            gh pr edit "$PR_URL" --add-label "merge-ready"
          else
            gh pr edit "$PR_URL" --remove-label "merge-ready" 2>/dev/null || true
            echo "Not approving $PR_URL — state=$STATE (owner block or failing checks)."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
